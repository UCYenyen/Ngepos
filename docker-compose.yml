# Runs on the VPS. Pulls the image built by CI and pushed to GHCR, and injects
# ALL runtime environment from the VPS's own .env file (env_file below) — so your
# real secrets live only on the server, never in the repo or GitHub.
#
#   docker compose pull && docker compose up -d
#
# Pin a specific build for rollback with:  NGEPOS_IMAGE=ghcr.io/ucyenyen/ngepos:<sha> docker compose up -d

services:
  web:
    image: ${NGEPOS_IMAGE:-ghcr.io/ucyenyen/ngepos:latest}
    container_name: ngepos
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
